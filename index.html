<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Power BI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      background: #0078d7;
      padding: 1rem;
      text-align: center;
    }
    header a {
      background: #fff;
      color: #0078d7;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }
    header a:hover {
      background: #005a9e;
      color: #fff;
    }
    iframe {
      margin-top: 1rem;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Botón arriba -->
  <header>
    <a href="https://forms.cloud.microsoft/pages/responsepage.aspx?id=G-0X-QO0xUm4C7quPOA3Wrnipcu09FtCqy5AxXc4r2ZUOUxaN1FaOTVMS0lLWjFEV1M2MFo1Sk5OUC4u&route=shorturl" target="_blank">
      🔄 Actualizar Dashboard
    </a>
  </header>

  <!-- Dashboard Power BI incrustado -->
  <iframe 
    title="Reporte Incidencias NOC (Nuevo) V3" 
    width="1000" 
    height="600" 
    src="https://app.powerbi.com/view?r=eyJrIjoiOWZhM2EyNTktMDE3YS00NDliLTg2NTMtZDM1YjNiY2RlN2Y4IiwidCI6ImY5MTdlZDFiLWI0MDMtNDljNS1iODBiLWJhYWUzY2UwMzc1YSJ9" 
    allowfullscreen="true">
  </iframe>

</body>
</html>
